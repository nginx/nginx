name: Trigger auto deployment for my

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/my-AutoDeployTrigger-c86a453c-5c75-49de-8580-c40022feb7a6.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MY_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: hub.docker.com/r/nizampatnamnarasimha/nginx
          registryUsername: ${{ secrets.MY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MY_REGISTRY_PASSWORD }}
          containerAppName: my
          resourceGroup: my_rsg
          imageToBuild: hub.docker.com/r/nizampatnamnarasimha/nginx/my:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


